[project]
name = "factualai"
version = "1.0.0"
description = "An AI-Powered Multilingual and Multimodal Fake News Detection System"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Chetana Rane" },
    { name = "Lakhichand Khushal Patil" },
    { name = "Kalpesh A. Popat" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
