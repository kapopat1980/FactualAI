[project]
name = "factualai"
version = "1.1.0"
description = "FactualAI: multilingual and multimodal fake news detection with a leakage-aware evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Chetana Rane" },
    { name = "Lakhichand Khushal Patil" },
    { name = "Kalpesh A. Popat" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
